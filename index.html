<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de ventas</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#e3e6ea;--ac:#0f766e;--ac2:#fff;--dg:#b42318;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1d2125;--tx:#eceff2;--mut:#9aa4af;--bd:#2d333a;--ac:#2dd4bf;--ac2:#06201d;--dg:#f97066;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1d2125;--tx:#eceff2;--mut:#9aa4af;--bd:#2d333a;--ac:#2dd4bf;--ac2:#06201d;--dg:#f97066;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.stat small{color:var(--mut);display:block}
.stat b{font-size:1.25rem}
form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
form .full{grid-column:1/-1}
label{font-size:.85rem;color:var(--mut);display:block;margin-bottom:4px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:11px;border:0;border-radius:8px;background:var(--ac);color:var(--ac2);font:inherit;font-weight:600;cursor:pointer}
.del{background:none;color:var(--dg);padding:4px 8px}
.head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.head b{font-size:1.05rem}
.head button{padding:8px 12px}
.tot{font-weight:600;text-align:right}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:.8rem}
td.n,th.n{text-align:right}
.empty{color:var(--mut);text-align:center;padding:20px}
.vc{border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--bg)}
.vh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
.vh b{font-size:1.1rem}
.vh span{order:3;margin-left:auto;font-size:1.3rem;font-weight:700;color:var(--ac);white-space:nowrap;text-align:right}
.vh span small{display:block;font-size:.7rem;font-weight:600;color:var(--mut)}
.clr{flex:1;min-width:0;order:2;display:flex;flex-wrap:wrap;gap:2px 16px;font-size:1.05rem;font-weight:600}
.vh>div:first-child{flex:0 0 100%;order:1}
.vg{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.vg small,.vc2 small{display:block;color:var(--mut);font-size:.75rem}
.vg b,.vc2 b{font-weight:600;word-break:break-word}
.vc2{margin-bottom:12px}
.vd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.alert{background:#fef3c7;color:#78350f;border:1px solid #f59e0b;border-radius:12px;padding:12px 14px;margin-bottom:12px}
.alert b{display:block;margin-bottom:4px}
.alert div{font-size:.9rem;padding:2px 0}
.ah{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.alert .ah b{margin:0}
.ah span{font-size:.85rem;font-weight:600;white-space:nowrap}
.all{max-height:40vh;overflow-y:auto;margin-top:6px}
.vc.pend{border:2px solid #f59e0b}
.st{display:inline-block;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:10px}
.st.p{background:#fef3c7;color:#78350f}
.st.r{background:#d1fae5;color:#065f46}
.okb{background:#16a34a;color:#fff}
.pn{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.fe{font-style:normal;font-size:.75rem;font-weight:700;background:#e0f2fe;color:#075985;padding:2px 8px;border-radius:999px;white-space:nowrap}
.rg{font-size:.75rem;color:var(--mut);margin-top:8px}
@media(max-width:480px){.stats{grid-template-columns:1fr}}
.lg{max-width:460px;margin:5vh auto 0;padding:16px}
.lg .card{display:grid;grid-template-columns:1fr;gap:18px;padding:24px}
.lg label{font-size:1rem}
.lg input[type=email],.lg input[type=password]{padding:16px 14px;font-size:1.15rem;border-radius:10px}
.lg input[type=checkbox]{width:20px!important;height:20px}
.lg button{padding:16px;font-size:1.1rem}
.logo{display:block;max-width:200px;max-height:150px;margin:0 auto 14px;object-fit:contain}
.lg .logo{max-width:320px;max-height:230px}
.logo.sm{max-width:84px;max-height:60px;margin:0}
.top{display:flex;align-items:center;gap:12px;margin:8px 0 16px}
.top h1{margin:0}
.lg h1{margin:0 0 14px;text-align:center}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mut);font-size:.85rem;margin:-8px 0 12px}
.who button{background:none;color:var(--mut);border:1px solid var(--bd);padding:4px 10px;font-weight:500}
</style>
</head>
<body>
<div class="lg" id="lg">
<img class="logo" alt="Variedades Vásquez">
<h1>Registro de ventas</h1>
<form class="card" id="lgf" style="display:grid">
<div><label for="em">Correo</label><input id="em" name="email" type="email" autocomplete="username" required></div>
<div><label for="pw">Contraseña</label><input id="pw" name="password" type="password" autocomplete="current-password" required></div>
<label style="display:flex;align-items:center;gap:8px;color:var(--tx);font-size:.95rem;margin:0"><input id="rc" type="checkbox" style="width:auto" checked> Recordar mi correo</label>
<div id="lgerr" style="color:var(--dg);font-size:.9rem"></div>
<button id="lgb" type="submit">Entrar</button>
</form>
</div>
<main id="app" style="display:none">
<div class="top"><img class="logo sm" alt=""><h1>Registro de ventas</h1></div>
<div class="who"><span id="st"></span><button id="out" type="button">Cerrar sesión</button></div>
<div id="al" class="alert" style="display:none"></div>
<div class="stats">
<div class="card stat"><small>Hoy</small><b id="sHoy">$0.00</b></div>
<div class="card stat"><small>Este mes</small><b id="sMes">$0.00</b></div>
<div class="card stat"><small>Total</small><b id="sTot">$0.00</b></div>
</div>
<form class="card" id="f" novalidate>
<div class="full"><label for="prod">Producto o servicio</label><input id="prod" required placeholder="Ej. Camisa azul"></div>
<div><label for="cant">Cantidad</label><input id="cant" type="number" min="1" step="1" value="1" required></div>
<div><label for="prec">Precio total ($)</label><input id="prec" type="text" inputmode="decimal" placeholder="0.00"></div>
<div><label for="fecha">Fecha para entrega</label><input id="fecha" type="date" required></div>
<div><label for="pago">Pago</label><select id="pago"><option>Efectivo</option><option>Transferencia</option></select></div>
<div><label for="cli">Nombre del cliente</label><input id="cli"></div>
<div><label for="tel">Número de contacto</label><input id="tel" type="tel" inputmode="tel"></div>
<div class="full"><label for="ent">Entrega</label><select id="ent"><option>Plaza Centro</option><option>Metropolitano</option><option>Encomendista</option></select></div>
<div class="full" id="encw" style="display:none"><label>Encomendista</label><div style="display:flex;gap:20px;flex-wrap:wrap"><label style="display:flex;align-items:center;gap:6px;margin:0;color:var(--tx);font-size:1rem"><input type="radio" name="enc" value="C807" style="width:auto"> C807</label><label style="display:flex;align-items:center;gap:6px;margin:0;color:var(--tx);font-size:1rem"><input type="radio" name="enc" value="Pedidos Express" style="width:auto"> Pedidos Express</label></div></div>
<div class="full"><label for="com">Comentarios</label><input id="com"></div>
<div id="err" class="full" style="color:var(--dg);font-size:.9rem;display:none"></div>
<button class="full" type="submit" id="sb">Registrar venta</button>
<button class="full" type="button" id="cx" style="display:none;background:none;color:var(--tx);border:1px solid var(--bd)">Cancelar edición</button>
</form>
<div class="card">
<div class="head"><b>Ventas</b><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="exp" type="button">Exportar a Excel</button><button id="rst" type="button" style="background:none;color:var(--dg);border:1px solid var(--dg)">Empezar mes nuevo</button></div></div>
<div id="rows"></div>
</div>
</main>
<div id="mod" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:16px;z-index:50"><div class="card" style="max-width:360px;margin:0"><p id="mm" style="margin-top:0"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button id="mn" type="button" style="background:none;color:var(--tx);border:1px solid var(--bd)">Cancelar</button><button id="my" type="button">Aceptar</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
